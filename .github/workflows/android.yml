name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, coderabbit/android-port]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
      - name: Install Haxe dependencies and prepare bundled mod
        run: |
          haxelib setup "$RUNNER_TEMP/haxelib"
          bash setup/setup-android.sh
      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/25.2.9519653"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
      - name: Build ARM64 APK
        run: haxelib run lime build android -arm64 -D HXCPP_COMPILE_THREADS=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vloo-Guy-Android-arm64
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
