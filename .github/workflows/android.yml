name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, coderabbit/android-port]
  pull_request:
    branches: [main, coderabbit/android-port]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
      - name: Install Haxe dependencies and prepare bundled mod
        run: |
          haxelib setup "$RUNNER_TEMP/haxelib"
          bash setup/setup-android.sh
      - name: Test packaged and extracted JSON loading
        run: bash tests/run-assets.sh
      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/25.2.9519653"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config ANDROID_HOST linux-x86_64
          haxelib run lime config HXCPP_STRIP "$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
      - name: Restore native build cache
        uses: actions/cache/restore@v4
        with:
          path: export/release/android/obj
          key: ${{ runner.os }}-vloo-arm64-v1-${{ hashFiles('setup/setup-android.sh') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vloo-arm64-v1-${{ hashFiles('setup/setup-android.sh') }}-
      - name: Build ARM64 APK
        run: haxelib run lime build android -DHXCPP_COMPILE_THREADS="$(nproc)"
      - name: Save native build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: export/release/android/obj
          key: ${{ runner.os }}-vloo-arm64-v1-${{ hashFiles('setup/setup-android.sh') }}-${{ github.sha }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vloo-Guy-Android-arm64
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
